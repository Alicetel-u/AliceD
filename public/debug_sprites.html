<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #333;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        .container {
            position: relative;
            display: inline-block;
            margin-top: 50px;
        }

        img {
            border: 2px solid white;
            width: 512px;
            height: auto;
            image-rendering: pixelated;
        }

        /* Display larger */
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .row-label {
            position: absolute;
            left: -100px;
            width: 90px;
            text-align: right;
            line-height: 1;
            font-weight: bold;
        }

        .r1 {
            top: 12.5%;
        }

        .r2 {
            top: 37.5%;
        }

        .r3 {
            top: 62.5%;
        }

        .r4 {
            top: 87.5%;
        }

        .line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <h1>Player Sprite Sheet Debug</h1>
    <p>Using: public/assets/player.png (8 columns x 4 rows)</p>
    <div class="container">
        <img src="./assets/player.png" alt="Player Sprite">
        <div class="grid">
            <div class="row-label r1">Row 1<br>(Idle)</div>
            <div class="row-label r2">Row 2<br>(Run)</div>
            <div class="row-label r3">Row 3<br>(Jump)</div>
            <div class="row-label r4">Row 4<br>(Glide)</div>

            <div class="line" style="top: 25%"></div>
            <div class="line" style="top: 50%"></div>
            <div class="line" style="top: 75%"></div>
        </div>
    </div>
</body>

</html>
